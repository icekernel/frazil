name: secrets
on: pull_request
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # The base branch's scanner (HEAD^1 of the PR merge commit) scans the PR's files, so a PR
      # cannot weaken its own check; the PR's copy runs only while the base has none.
      - run: |
          base=$(git rev-parse --verify HEAD^1)
          src=HEAD; git cat-file -e "$base:tools/secrets" 2>/dev/null && src=$base
          echo "scanner from $src (base $base)"
          git show "$src:tools/secrets" > "$RUNNER_TEMP/secrets"
          python3 -I "$RUNNER_TEMP/secrets"
